name: maestro-runner e2e

# Runs the Maestro flows (.maestro/) on CI with maestro-runner, on iOS and
# Android, the way .maestro/scripts/run-tests.sh runs them locally: Debug
# build with Metro, the same simulator/emulator models, the same two passes.
# See .maestro/scripts/ci/run-maestro-runner.sh.

on:
  push:
    branches: [maestro-runner-e2e]
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Record new baseline screenshots instead of comparing
        type: boolean
        default: false

env:
  MAESTRO_RUNNER_VERSION: 1.1.28.1

jobs:
  e2e-ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Restore cocoapods
        id: cocoapods-cache
        uses: actions/cache/restore@v4
        with:
          path: '**/ios/Pods'
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('apps/example/ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-cocoapods-

      - name: Install cocoapods
        if: steps.cocoapods-cache.outputs.cache-hit != 'true'
        run: cd apps/example/ios && pod install
        env:
          NO_FLIPPER: 1

      - name: Save cocoapods
        if: steps.cocoapods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: '**/ios/Pods'
          key: ${{ steps.cocoapods-cache.outputs.cache-primary-key }}

      - name: Install maestro-runner
        run: curl -fsSL https://open.devicelab.dev/install/maestro-runner | bash -s -- --version "$MAESTRO_RUNNER_VERSION"

      # The project's own simulator setup: iPhone 17, iOS 26.2, autocorrection,
      # spell checking and autocapitalization off.
      - name: Set up the simulator
        id: sim
        run: |
          .maestro/scripts/setup-ios-simulator.sh | tee /tmp/sim.txt
          echo "udid=$(grep '^DEVICE_ID=' /tmp/sim.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Start Metro
        run: yarn example start > /tmp/metro.log 2>&1 &

      - name: Run e2e tests
        run: |
          .maestro/scripts/ci/run-maestro-runner.sh --platform ios --device "${{ steps.sim.outputs.udid }}" \
            ${{ inputs.update_screenshots && '--update-screenshots' || '' }}

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios-artifacts
          if-no-files-found: warn
          path: |
            reports/
            .maestro/enrichedInput/screenshots/ios/
            .maestro/enrichedText/screenshots/ios/
            /tmp/metro.log

  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install maestro-runner
        run: curl -fsSL https://open.devicelab.dev/install/maestro-runner | bash -s -- --version "$MAESTRO_RUNNER_VERSION"

      - name: Start Metro
        run: yarn example start > /tmp/metro.log 2>&1 &

      # The project's emulator (setup-android-emulator.sh): Pixel 9, API 36,
      # Google Play image, hardware keyboard.
      - name: Run e2e tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_9
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: true
          script: .maestro/scripts/ci/run-maestro-runner.sh --platform android --device emulator-5554 ${{ inputs.update_screenshots && '--update-screenshots' || '' }}

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-artifacts
          if-no-files-found: warn
          path: |
            reports/
            .maestro/enrichedInput/screenshots/android/
            .maestro/enrichedText/screenshots/android/
            /tmp/metro.log
